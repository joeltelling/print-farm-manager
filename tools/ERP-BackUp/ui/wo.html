<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>acres-erp — Manufacturing · Work Orders</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/ui/assets/nav.css">
  <style>
    td.num,th.num{text-align:right}
    .muted{color:var(--muted)}
    .icon-btn{border:none;background:#1b1b1b;padding:6px 10px;border-radius:8px;cursor:pointer}
    .icon-btn:hover{background:#242424}
  </style>
</head>
<body>
  <div class="container">
    <h1>Work Orders</h1>

    <!-- New WO -->
    <div class="card">
      <h2>New WO</h2>
      <div class="form-grid-3">
        <div>
          <label for="kind">Type (warehouse code)</label>
          <select id="kind" class="input"></select>
        </div>
        <div>
          <label for="fg_item">Finished good (has BOM)</label>
          <select id="fg_item" class="input"></select>
          <div class="muted" id="fg_hint"></div>
        </div>
        <div>
          <label for="loc_to">Location (inventory code)</label>
          <select id="loc_to" class="input"></select>
        </div>
        <div>
          <label for="qty_make">Qty Planned</label>
          <input id="qty_make" class="input" type="number" step="1" data-num="int" value="1">
        </div>
      </div>
      <div class="hstack" style="margin-top:8px">
        <button class="btn" id="btnCreate">Create WO</button>
        <span id="msg" class="pill"></span>
      </div>
    </div>

    <!-- List -->
    <div class="card">
      <div class="hstack space-between">
        <h2>List</h2>
        <div class="hstack">
          <input id="search" class="input" placeholder="Filter by SKU/Name">
          <button class="btn" id="btnRefresh">Refresh</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Warehouse</th>
            <th class="num">Qty Completed</th>
            <th>SKU</th>
            <th>Name</th>
            <th class="num">Qty planned</th>
            <th>Status</th>
            <th class="num">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initApi, apiGet, apiPost } from "./js/api.js";
    import { enforceUS, applyUSNumericUI, readNum, n0 } from "./js/us.js";

    const $ = (id)=>document.getElementById(id);
    function toast(msg, isError=false){
      let el = document.querySelector(".toast");
      if(!el){
        el = document.createElement("div");
        el.className = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.style.background = isError ? "#c0392b" : "#2c3e50";
      el.style.color = "#fff";
      el.style.position = "fixed";
      el.style.bottom = "12px";
      el.style.left = "12px";
      el.style.padding = "10px 14px";
      el.style.borderRadius = "6px";
      el.style.zIndex = 9999;
      el.style.boxShadow = "0 2px 8px rgba(0,0,0,0.3)";
      el.style.opacity = "0.95";
      setTimeout(()=>{ if(el) el.remove(); }, 4000);
    }
    const asArray = (m)=> Array.isArray(m) ? m : (m?.rows ?? []);
    const setMsg = (t)=> { $("msg").textContent = t||""; if(t) setTimeout(()=>$("msg").textContent="",1500); };

    // caches
    let ITEMS=[], ITEM_BY_ID=new Map(), WHS=[], LOCS=[];

    async function fetchAllItems(){
      const out=[]; let off=0, batch=[];
      do{
        batch = asArray(await apiGet("/items",{limit:200,offset:off}))||[];
        out.push(...batch); off+=batch.length;
      }while(batch.length===200);
      return out;
    }
    async function loadItems(){
      ITEMS = await fetchAllItems();
      ITEM_BY_ID = new Map(ITEMS.map(i=>[i.id,i]));
    }

    async function loadWarehouses(){
      WHS = asArray(await apiGet("/warehouses",{limit:200,offset:0}))||[];
    }

    async function loadLocations(){
      LOCS = asArray(await apiGet("/locations",{limit:1000,offset:0}))||[];
      // normalize numeric warehouse_id in case it comes as string
      for (const l of LOCS){
        if (l.warehouse_id != null) l.warehouse_id = Number(l.warehouse_id);
      }
    }

    function fillLocationSelect(whCode){
      const sel = $("loc_to"); sel.innerHTML="";
      let rows = [...LOCS].sort((a,b)=> String(a.code||"").localeCompare(String(b.code||"")));
      if (!rows.length){
        const o=document.createElement("option"); o.value=""; o.textContent="(no locations)"; sel.appendChild(o);
        return;
      }
      for (const r of rows){
        const o=document.createElement("option");
        o.value = r.code || "";
        o.textContent = r.code || "";
        sel.appendChild(o);
      }
    }

    function fillKindSelect(){
      const sel = $("kind"); sel.innerHTML = "";
      if (!WHS.length){
        const o=document.createElement("option"); o.value="FG"; o.textContent="FG (default)"; sel.appendChild(o);
        return;
      }
      const sorted = [...WHS].sort((a,b)=> String(a.code||"").localeCompare(String(b.code||"")));
      for (const w of sorted){
        const o=document.createElement("option");
        o.value = w.code || "";
        o.textContent = w.code || "";
        sel.appendChild(o);
      }
      // preseleccionar FIN_GOOD si existe
      const hasFin = sorted.find(w=>String(w.code||"").toLowerCase()==="fin_good");
      if (hasFin) sel.value = hasFin.code;
      fillLocationSelect(sel.value);
    }

    // Llena el combo EXCLUSIVAMENTE con finished goods que ya tienen BOM
    async function fillFgSelect(){
      const sel = $("fg_item"); sel.innerHTML = "";
      const boms = asArray(await apiGet("/bom",{limit:1000,offset:0}))||[];
      if(!boms.length){
        const o=document.createElement("option"); o.value=""; o.textContent="(no BOMs yet)";
        sel.appendChild(o);
        $("fg_hint").textContent = "Create a BOM first.";
        return;
      }
      $("fg_hint").textContent = "";

      const enriched = boms.map(b=>{
        const it = ITEM_BY_ID.get(Number(b.item_id));
        const sku = it?.sku || b.item_sku;
        const name= it?.name|| b.item_name;
        return { item_id: Number(b.item_id), sku, name };
      }).sort((a,b)=> (a.sku||"").localeCompare(b.sku||""));

      for(const rec of enriched){
        const o=document.createElement("option");
        o.value = String(rec.item_id);     // ← item_id del item con BOM
        o.dataset.sku = rec.sku || "";    // ← sku para compat
        o.textContent = `${rec.sku} — ${rec.name||""}`;
        sel.appendChild(o);
      }
    }

    async function downloadPickList(woId){
      const wo = await apiGet(`/wo/${woId}`);
      // Buscar BOM cuyo item_id == wo.item_id
      const boms = asArray(await apiGet("/bom",{limit:500,offset:0,q: ITEM_BY_ID.get(Number(wo.item_id))?.sku || ""})) || [];
      const bomRow = boms.find(b=> Number(b.item_id) === Number(wo.item_id));
      if (!bomRow) throw new Error("No BOM para este WO");
      const bomFull = await apiGet(`/bom/${bomRow.id}`);
      const lines = bomFull?.lines || [];

      const win = window.open("", "_blank");
      const doc = win.document;
      const qtyPlanned = Number(wo.qty_planned ?? 0);
      
      // Generate QR code URL (using qr.tec.br or similar free service)
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.origin + '/ui/qr-scan.html?wo=' + woId)}`;
      
      doc.write(`<html><head><title>Pick List WO ${wo.id}</title>
        <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        h1 { font-size: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 12px; }
        th { background: #f2f2f2; text-align: left; }
        .num { text-align: right; }
        .qr-section { margin-top: 24px; padding-top: 24px; border-top: 2px solid #ccc; text-align: center; }
        .qr-section img { max-width: 200px; }
        .qr-label { font-weight: bold; margin-top: 8px; font-size: 12px; }
        </style>
      </head><body>`);
      doc.write(`<h1>Pick List WO ${wo.id}</h1>`);
      doc.write(`<p>Item: ${ITEM_BY_ID.get(Number(wo.item_id))?.sku || ""} - ${ITEM_BY_ID.get(Number(wo.item_id))?.name || ""}</p>`);
      doc.write(`<p>Qty Planned: ${qtyPlanned}</p>`);
      doc.write(`<table><thead><tr><th>#</th><th>Component</th><th class="num">Qty per Unit</th><th class="num">Qty Planned</th></tr></thead><tbody>`);
      lines.forEach((ln, idx)=>{
        const qtyPerUnit = Number(ln.qty||0);
        const qtyTotal = qtyPerUnit * qtyPlanned;
        doc.write(`<tr><td>${idx+1}</td><td>${ln.name || ln.sku || ln.component_item_id}</td><td class="num">${qtyPerUnit}</td><td class="num">${qtyTotal}</td></tr>`);
      });
      doc.write(`</tbody></table>`);
      doc.write(`<div class="qr-section"><img src="${qrUrl}" alt="QR Code"><div class="qr-label">Scan to complete WO</div></div>`);
      doc.write(`</body></html>`);
      doc.close();
      win.focus();
      win.print();
    }

    async function refreshList(){
      const q = $("search").value.trim() || undefined;
      const data = asArray(await apiGet("/wo",{q,limit:500,offset:0})) || [];
      const tbody = $("rows"); tbody.innerHTML = "";
      for(const r of data){
        const it = ITEM_BY_ID.get(Number(r.item_id));
        const tr = document.createElement("tr");
        const qtyPlanned = n0((r.qty_planned ?? r.qty) || 0);
        const qtyCompleted = n0(r.qty_completed ?? r.qty ?? 0);
        tr.innerHTML = `
          <td>${r.id}</td>
          <td>${r.warehouse_code ?? r.kind}</td>
          <td class="num"><input class="input input-sm qty-completed" data-wo="${r.id}" data-planned="${qtyPlanned}" type="number" step="any" min="0" value="${qtyCompleted || qtyPlanned || 0}"></td>
          <td>${it?.sku ?? (r.sku ?? "")}</td>
          <td>${it?.name ?? (r.name ?? "")}</td>
          <td class="num">${qtyPlanned}</td>
          <td>${r.status}</td>
          <td class="num">
            ${r.status==="completed" ? "" : `<button class="icon-btn" data-complete="${r.id}">Complete</button>`}
            <button class="icon-btn" data-pick="${r.id}">Pick List</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
      tbody.onclick = async (e)=>{
        const btnComplete = e.target.closest("button[data-complete]");
        if(btnComplete){
          const id = Number(btnComplete.getAttribute("data-complete"));
          const input = tbody.querySelector(`input.qty-completed[data-wo="${id}"]`);
          let qty = input ? Number(input.value || 0) : 0;
          const planned = input ? Number(input.dataset.planned || 0) : 0;
          if (!qty || qty <= 0) qty = planned;
        try{
          setMsg("completing...");
            await apiPost(`/wo/${id}/complete`, { qty_completed: qty });
          setMsg("ok"); await refreshList();
        }catch(err){
            let detail = err?.response?.detail || err?.message || String(err);
            if (typeof detail === "object" && detail?.missing){
              const first = detail.missing[0];
              detail = `Falta stock: ${first?.sku || first?.name || first?.item_id}`;
            }
            toast(detail, true);
          setMsg("error");
          }
          return;
        }
        const btnPick = e.target.closest("button[data-pick]");
        if(btnPick){
          const id = Number(btnPick.getAttribute("data-pick"));
          try{
            await downloadPickList(id);
          }catch(err){
            toast(err?.message || "Error generando Pick List", true);
          }
        }
      };
    }

    $("btnRefresh").addEventListener("click", refreshList);

    $("btnCreate").addEventListener("click", async ()=>{
      try{
        setMsg("creating...");
        const kind = $("kind").value || "FG";
        const opt  = $("fg_item").selectedOptions[0];
        const item_id = Number(opt?.value || 0);
        const item_sku = opt?.dataset?.sku || "";
        const qty  = readNum($("qty_make"));
        if(!(item_id>0)) throw new Error("Pick a finished good with BOM");
        if(!(qty>0)) throw new Error("Qty must be > 0");

        // ← usa apiPost (construye URL base correcta)
        await apiPost("/wo", {
          kind,
          item_id,
          item_sku,
          qty_planned: Number(n0(qty)),
          warehouse_code: kind,
          location_code: $("loc_to").value || null
        });
        setMsg("ok");
        await refreshList();
      }catch(err){
        const msg = err?.message || String(err);
        alert("Create failed: " + msg);
        setMsg("error");
      }
    });

    // init
    await initApi();
    enforceUS(document); applyUSNumericUI(document);
    await loadItems();
    await loadWarehouses();
    await loadLocations();
    fillKindSelect();
    await fillFgSelect(); // desde BOM
    await refreshList();
  </script>

  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
