<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ACRES-ERP — Sales Pricing</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/ui/assets/nav.css">
</head>
<body>
  <div class="container">
    <h1>Sales — Pricing</h1>
    <div id="pricing" class="card">
      <h2>Pricing</h2>
      <div class="hstack">
        <input id="prSearch" class="input" type="search" placeholder="Search by SKU/Name">
        <button class="btn" id="prSearchBtn" type="button">Search</button>
        <span id="prMsg" class="pill" aria-live="polite"></span>
      </div>
      <div class="card" style="margin-top:12px;">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>SKU</th>
              <th>Cost</th>
              <th>Margin %</th>
              <th>Margin $</th>
              <th>Ads %</th>
              <th>Fee %</th>
              <th>Selling Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="prRows"></tbody>
        </table>
        <div class="hstack" style="margin-top:12px;">
          <button class="btn" id="prPrev" type="button">Prev</button>
          <span id="prPage" class="muted"></span>
          <button class="btn" id="prNext" type="button">Next</button>
          <span id="prStatus" class="pill" aria-live="polite"></span>
          <button class="btn" id="prSave" type="button" disabled>Save</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/ui/js/sales_pricing.js"></script>
  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
