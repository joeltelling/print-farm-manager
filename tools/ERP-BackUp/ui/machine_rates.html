<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>acres-erp — Manufacturing · Machine Rates</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/ui/assets/nav.css">
</head>
<body>
  <div class="container">
    <h1>Machine Rates</h1>

    <!-- ===== Tarjeta: New / Update rate ===== -->
    <div class="card">
      <h2>New / Update rate</h2>

      <div class="form-grid-3">
        <div>
          <label for="machine">Machine</label>
          <input class="input" id="machine" list="dl-mach" placeholder="Machine" />
          <datalist id="dl-mach"></datalist>
          
        <div>
          <label for="hourly_rate">Hourly rate (USD/h)</label>
          <input class="input" id="hourly_rate" type="number" step="0.0001" min="0" placeholder="0.0000" />
        </div>
      </div>

      <div class="hstack">
        <button class="btn" id="btnSave">Save</button>
        <span id="msg" class="pill" aria-live="polite"></span>
      </div>

      <div id="backend_hint" class="pill" style="display:none; margin-top:.75rem;"></div>
    </div>

    <!-- ===== Tarjeta: List ===== -->
    <div class="card">
      <div class="hstack space-between">
        <h2>Rates</h2>
        <div class="hstack">
          <input class="input" id="search" placeholder="Filter by machine">
          <button class="btn" id="refresh">Refresh</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Machine</th>
            <th>Hourly rate (USD/h)</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="muted" style="margin-top:.5rem;">Tip: clic en una fila para editarla.</div>
    </div>
  </div>

  <script type="module">
    import { initApi, apiGet, apiPost } from "./js/api.js";

    const $ = (id)=>document.getElementById(id);
    const setMsg = (t)=> $("msg").textContent = t || "";
    const asArray = maybe => Array.isArray(maybe) ? maybe : (maybe?.rows ?? []);
    const fmt4 = (n)=> (Number(n||0).toFixed(4));

    let RATES = [];            // machines with rate from backend
    let HAS_ENDPOINT = false;  // si /mfg/machines responde
    let CANDIDATE_MACH = [];   // candidatos para datalist

    async function loadMachineCandidates(){
      const set = new Set();
      // 1) nombres ya guardados en /mfg/machines
      try {
        const data = asArray(await apiGet("/mfg/machines", { limit: 1000, offset: 0 })) || [];
        for (const r of data) if (r.machine) set.add(String(r.machine).trim());
      } catch {}
      // 2) fallback: machines used in component recipes
      try {
        const data = asArray(await apiGet("/mfg/components", { limit: 1000, offset: 0 })) || [];
        for (const r of data) if (r.machine) set.add(String(r.machine).trim());
      } catch {}

      CANDIDATE_MACH = [...set].sort((a,b)=>a.localeCompare(b));
      const dl = $("dl-mach"); dl.innerHTML = "";
      for (const m of CANDIDATE_MACH){
        const opt = document.createElement("option");
        opt.value = m;
        dl.appendChild(opt);
      }
    }

    async function loadRates(){
      try{
        const data = await apiGet("/mfg/machines", { limit: 1000, offset: 0 });
        RATES = asArray(data);
        HAS_ENDPOINT = true;
        $("backend_hint").style.display = "none";
      }catch(e){
        HAS_ENDPOINT = false;
        RATES = [];
        const el = $("backend_hint");
        el.style.display = "";
        el.textContent = "Backend still does not expose /mfg/machines (GET/POST). UI is ready; once the endpoint exists, this notice will go away.";
      }
    }

    function fillFormFromRow(r){
      $("machine").value = r.machine || "";
      $("hourly_rate").value = (r.hourly_rate != null) ? String(Number(r.hourly_rate)) : "";
      setMsg("");
    }

    function renderTable(){
      const q = ($("search").value || "").trim().toLowerCase();
      const tbody = $("rows"); tbody.innerHTML = "";
      const rows = RATES
        .filter(r => !q || String(r.machine||"").toLowerCase().includes(q))
        .sort((a,b)=> String(a.machine||"").localeCompare(String(b.machine||"")));
      for (const r of rows){
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.innerHTML = `
          <td>${r.machine ?? ""}</td>
          <td>${fmt4(r.hourly_rate)}</td>
        `;
        tr.addEventListener("click", ()=> fillFormFromRow(r));
        tbody.appendChild(tr);
      }
    }

    $("refresh").addEventListener("click", async ()=>{
      await loadRates();
      renderTable();
      await loadMachineCandidates(); // refresh suggestions if something changed
    });

    $("btnSave").addEventListener("click", async ()=>{
      try{
        setMsg("saving...");
        const machine = ($("machine").value || "").trim();
        const hourly_rate = Number($("hourly_rate").value || "0");
        if(!machine) throw new Error("Machine es obligatorio");
        if(!(hourly_rate >= 0)) throw new Error("Hourly rate debe ser ≥ 0");
        if(!HAS_ENDPOINT){
          throw new Error("Backend no disponible para /mfg/machines. Aplica el router y vuelve a intentar.");
        }
        await apiPost("/mfg/machines", { machine, hourly_rate });
        setMsg("ok");
        await loadRates();
        renderTable();
        await loadMachineCandidates();
      }catch(e){
        alert("Error: " + (e.message || e));
        setMsg("error");
      }finally{
        setTimeout(()=> setMsg(""), 1500);
      }
    });

    // init
    await initApi();
    await loadRates();
    renderTable();
    await loadMachineCandidates();
  </script>

  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
