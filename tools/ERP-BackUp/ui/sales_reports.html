<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ACRES-ERP — Sales Reports</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/ui/assets/nav.css">
</head>
<body>
  <div class="container">
    <h1>Sales — Reports</h1>
    <div class="card" id="history-card">
      <h2>Sales History</h2>
      <p class="muted">Filter by date range to see sold items, unit price, margins, and totals. Export to CSV or PDF.</p>
      <div class="hstack wrap" style="gap:8px;">
        <label>From <input id="shStart" class="input" type="date"></label>
        <label>To <input id="shEnd" class="input" type="date"></label>
        <button class="btn" id="shLoad" type="button">Load</button>
        <button class="btn btn-reset" id="shCsv" type="button">Export CSV</button>
        <button class="btn btn-reset" id="shPdf" type="button">Export PDF</button>
        <span id="shMsg" class="pill" aria-live="polite"></span>
      </div>
      <div class="card" style="margin-top:12px;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>SKU</th>
              <th>Item</th>
              <th>Qty</th>
              <th>Unit $</th>
              <th>Total $</th>
              <th>Margin / unit</th>
            </tr>
          </thead>
          <tbody id="shRows"></tbody>
          <tfoot>
            <tr>
              <td colspan="3" style="text-align:right;">Totals</td>
              <td id="shTotalQty">0</td>
              <td></td>
              <td id="shTotalRev">$0.00</td>
              <td id="shTotalMargin">$0.00</td>
            </tr>
          </tfoot>
        </table>
        <div class="hstack" style="margin-top:12px; gap:8px;">
          <button class="btn" id="shPrev" type="button">Prev</button>
          <span id="shPage" class="muted"></span>
          <button class="btn" id="shNext" type="button">Next</button>
        </div>
      </div>
    </div>

    <div id="reports" class="card">
      <h2>Reports</h2>
      <div class="hstack wrap">
        <input id="rpSearch" class="input" type="search" placeholder="Search Item or SKU">
        <button class="btn" id="rpSearchBtn" type="button">Search</button>
        <span id="rpMsg" class="pill" aria-live="polite"></span>
      </div>
      <div class="card" style="margin-top:12px;">
        <table class="reports-table">
          <thead id="rpHead">
            <tr>
              <th>Item / SKU</th>
              <th>Cost</th>
              <th class="sortable" data-sort="margin_pct">Margin % <span class="sort-arrow" data-arrow="margin_pct">↕</span></th>
              <th class="sortable" data-sort="margin_usd">Margin $ <span class="sort-arrow" data-arrow="margin_usd">↕</span></th>
              <th>Fees $</th>
              <th class="sortable" data-sort="selling_price">Selling Price <span class="sort-arrow" data-arrow="selling_price">↕</span></th>
            </tr>
          </thead>
          <tbody id="rpRows"></tbody>
        </table>
        <div class="hstack" style="margin-top:12px;">
          <button class="btn" id="rpPrev" type="button">Prev</button>
          <span id="rpPage" class="muted"></span>
          <button class="btn" id="rpNext" type="button">Next</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/ui/js/sales_reports.js"></script>
  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
