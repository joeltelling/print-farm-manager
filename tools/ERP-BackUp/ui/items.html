<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>acres-erp — Items</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/ui/assets/nav.css">
</head>
<body>
  <div class="container">
    <h1>Items</h1>

    <div class="card">
      <h2>New item</h2>

      <div class="form-grid-3">
        <div>
          <label for="sku">SKU</label>
          <input class="input" id="sku" placeholder=" ">
        </div>
        <div>
          <label for="name">Name</label>
          <input class="input" id="name" placeholder=" ">
        </div>
        <div>
          <label for="wh_id">Warehouse</label>
          <select class="input" id="wh_id"></select>
        </div>
      </div>

      <div class="form-grid-3">
        <div>
          <label for="display_uom_code">Consumption UOM</label>
          <select class="input" id="display_uom_code"></select>
        </div>
        <div>
          <label for="purchase_uom_code">Purchasing UOM</label>
          <select class="input" id="purchase_uom_code"></select>
        </div>
      </div>

      <div class="hstack">
        <button class="btn" id="btnCreate">Create</button>
        <span id="msg" class="pill" aria-live="polite"></span>
      </div>
    </div>

    <div class="card">
      <div class="hstack space-between">
        <h2>List</h2>
        <div class="hstack">
          <input class="input" id="q" placeholder="Filter by SKU/Name" />
          <button class="btn" id="refresh">Refresh</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Warehouse</th>
            <th>Consumption UOM</th>
            <th>Purchasing UOM</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initApi, apiGet, apiPost } from "./js/api.js";
    const $ = (id)=>document.getElementById(id);

    let UOMS = [];
    let WAREHOUSES = [];
    const WH_BY_ID = new Map();
    const WH_BY_CODE = new Map();

    // ---- UOMs ----
    function fillUoms(){
      const dsel = $("display_uom_code");
      const psel = $("purchase_uom_code");
      dsel.innerHTML = ""; psel.innerHTML = "";
      for (const u of UOMS){
        for (const s of [dsel, psel]){
          const o = document.createElement("option");
          o.value = u.code; o.textContent = u.code; s.appendChild(o);
        }
      }
      const codes = new Set(UOMS.map(u=>u.code));
      if (codes.size){
        dsel.value = codes.has("G") ? "G" : (codes.has("EA")? "EA" : UOMS[0].code);
        psel.value = codes.has("KG")? "KG" : UOMS[0].code;
      }
    }
    async function loadUoms(){ UOMS = await apiGet("/uom"); fillUoms(); }

    // ---- Warehouses ----
    function fillWarehouses(){
      const sel = $("wh_id"); sel.innerHTML = "";
      for (const w of WAREHOUSES){
        const o=document.createElement("option");
        o.value = String(w.id); o.textContent = w.code; sel.appendChild(o);
      }
      // intentar seleccionar RAW_MAT si existe
      const want = WAREHOUSES.find(w=>w.code==="RAW_MAT") || WAREHOUSES[0];
      if (want) sel.value = String(want.id);
    }
    async function loadWarehouses(){
      WAREHOUSES = await apiGet("/warehouses");
      WH_BY_ID.clear(); WH_BY_CODE.clear();
      for (const w of WAREHOUSES){ WH_BY_ID.set(w.id, w); WH_BY_CODE.set(w.code, w); }
      fillWarehouses();
    }

    // ---- Listado ----
    async function loadList(){
      const q = $("q").value.trim();
      const rows = await apiGet("/items", { limit: 50, offset: 0, q });
      $("rows").innerHTML = rows.map(r=>{
        const w = r.warehouse_id ? WH_BY_ID.get(r.warehouse_id) : (r.item_type ? WH_BY_CODE.get(r.item_type) : null);
        const wcode = w ? w.code : (r.item_type || "");
        return `<tr>
          <td>${r.sku}</td>
          <td>${r.name ?? ""}</td>
          <td>${wcode}</td>
          <td>${r.display_uom_code ?? ""}</td>
          <td>${r.purchase_uom_code ?? ""}</td>
        </tr>`;
      }).join("");
    }

    // ---- Crear ----
    $("btnCreate").onclick = async ()=>{
      const sku = $("sku").value.trim();
      const name = $("name").value.trim();
      const wh_id = Number($("wh_id").value);
      const disp = $("display_uom_code").value || null;
      const purch = $("purchase_uom_code").value || null;
      const msg = $("msg");

      try{
        if(!sku) throw new Error("SKU requerido");
        if(!name) throw new Error("Nombre requerido");
        if(!wh_id) throw new Error("Warehouse requerido");
        if(!disp) throw new Error("Consumption UOM requerido");

        // compatible item_type: use the warehouse code (RAW_MAT/COMP/FIN_GOOD)
        const wh = WH_BY_ID.get(wh_id);
        const item_type = wh?.code || null;

        // deduce dimension a partir del UOM de consumo
        const all = await apiGet("/uom");
        const dim = (all.find(u=>u.code===disp)?.dimension || "").toUpperCase();

        const body = {
          sku, name,
          item_type,                 // compat con backend actual
          warehouse_id: wh_id,       // NUEVO enlace real
          dimension: dim || "COUNT",
          display_uom_code: disp,
          purchase_uom_code: purch || null
        };

        msg.textContent = "saving...";
        await apiPost("/items", body);
        msg.textContent = "ok";
        await loadList();
      }catch(e){
        alert("Error: " + (e.message||e));
        msg.textContent = "error";
      }finally{
        setTimeout(()=> msg.textContent="", 1500);
      }
    };

    $("refresh").onclick = loadList;

    // init
    await initApi();
    await loadWarehouses();
    await loadUoms();
    await loadList();
  </script>

  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
