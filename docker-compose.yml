services:
  print-farm-manager:
    build:
      context: .
      target: runtime
    image: print-farm-manager:latest
    container_name: print-farm-manager
    restart: unless-stopped
    # Host networking, not a published port: mDNS (.local hostname) resolution for
    # printers (server/mdns-resolve.js) sends real UDP multicast, which Docker's
    # default bridge network forwards unreliably (works for some printers, not
    # others, inconsistently between polls). Host networking puts the container
    # directly on the host's real network interface, the same as any other process
    # on the host, which is the standard fix for this class of problem. The app
    # still listens on port 3000 exactly as before; there is just no docker-proxy
    # NAT hop in front of it anymore, so `ports:` is meaningless here and Compose
    # would ignore it. Reach the app at <host-ip>:3000, not a container name: a
    # host-networked container has no normal internal Docker network address, so
    # a reverse proxy on this same Docker host must point at the host's own IP
    # (or `host.docker.internal` if that proxy's engine provides it) instead of
    # `print-farm-manager:3000`.
    network_mode: host
    # Optional single sign-on (see docs/auth.md). All four must resolve to a
    # non-empty value for SSO to activate. Values come from a local .env file
    # (see .env.example) next to this docker-compose.yml, which Compose loads
    # automatically and is gitignored: real client secrets never belong in
    # this tracked file. Left undefined, each substitutes to an empty string
    # and the app correctly treats OIDC as unconfigured.
    environment:
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
    volumes:
      - farm-data:/app/server/data
      - farm-gcode:/app/server/gcode

  # Development — hot reload for both server and client, no local Node.js
  # install required. Behind the `dev` profile so a bare `docker compose up`
  # (production) never starts this. Run it on its own — not alongside
  # production, which would fight over host port 3000 — by naming the service
  # explicitly: `docker compose up --build print-farm-manager-dev`. Naming a
  # service starts only that service (and its dependencies), regardless of its
  # profile, instead of "every service enabled for this invocation" the way a
  # bare `up`/`--profile dev up` with no service name would.
  print-farm-manager-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: print-farm-manager-dev
    ports:
      - "3000:3000"   # API server
      - "5173:5173"   # Vite dev server (hot reload) — open this one in a browser
    environment:
      # Vite's file watcher can miss change events over Docker Desktop's
      # bind-mount filesystem on macOS/Windows (virtiofs / gRPC-FUSE) — polling
      # is slightly more CPU but reliable on every host OS.
      - CHOKIDAR_USEPOLLING=true
      # Makes Vite bind 0.0.0.0 instead of localhost-only, so :5173 is reachable
      # through Docker's port publishing (see client/vite.config.js).
      - VITE_DOCKER_HOST=1
    volumes:
      - .:/app
      # Shadow the bind mount with the image's own node_modules (installed for
      # linux/node22 in the `dev` stage) instead of the host's — a host
      # node_modules here would either be missing or built for the wrong
      # platform/ABI (e.g. better-sqlite3 compiled for macOS/Windows).
      - /app/node_modules
      - /app/client/node_modules
      - farm-data-dev:/app/server/data
      - farm-gcode-dev:/app/server/gcode

volumes:
  farm-data:
  farm-gcode:
  farm-data-dev:
  farm-gcode-dev:
