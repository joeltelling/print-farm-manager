<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>acres-erp — Inventory · Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/ui/assets/nav.css">
  <style>
    .chart-wrap { width: 100%; }
    .chart { width: 100%; height: 300px; display: block; }
    .muted { opacity: .75; font-size: .95em; }
    .subtle { opacity: .55; }
    .legend { display: inline-flex; gap: 12px; align-items: center; margin: 6px 0 12px; }
    .legend .sw { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
    .sw-qty { background: #22c55e; }  /* green */
    .sw-val { background: #3b82f6; }  /* blue  */

    /* separates cards block per warehouse from the first card */
    #perWarehouseCards { margin-top: var(--space-4); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inventory — Dashboard</h1>

    <!-- ===== Card: Value by warehouse (simple bars) ===== -->
    <div class="card">
      <h2>Value by warehouse</h2>
      <div class="muted">Sum of <b>value (USD)</b> per warehouse.</div>
      <div class="chart-wrap"><canvas id="whValueChart" class="chart"></canvas></div>
    </div>

    <!-- ===== Cards per warehouse (spaced) ===== -->
    <div id="perWarehouseCards" class="stack-vertical"></div>
  </div>

  <script type="module">
    import { initApi, apiGet } from "./js/api.js";

    const $ = (id)=>document.getElementById(id);
    const asArray = (m)=> Array.isArray(m) ? m : (m?.rows ?? []);
    const fmtUSD = (n)=> "$" + Number(n||0).toFixed(2);
    const fmtQTY = (n)=> Number(n||0).toFixed(0);

    function niceMax(maxValue, headroom = 0.15) {
      const x = Number(maxValue || 0);
      if (!(x > 0)) return 1;
      const raw = x * (1 + headroom);
      const p = Math.pow(10, Math.floor(Math.log10(raw)));
      const steps = [1, 2, 5, 10];
      for (const s of steps) { const cand = s * p; if (raw <= cand) return cand; }
      return 10 * p;
    }

    function fitCanvas(canvas, targetHeight = 300) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 720;
      const cssH = canvas.clientHeight || targetHeight;
      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, W: cssW, H: cssH };
    }

    function drawBarChart(canvas, labels, values, opts = {}) {
      const { ctx, W, H } = fitCanvas(canvas, opts.height || 300);
      const margin = { top: 34, right: 12, bottom: 72, left: 64, ...(opts.margin||{}) };
      ctx.clearRect(0,0,W,H);
      ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
      const txt = getComputedStyle(document.body).getPropertyValue("--txt") || "#ddd";
      const br  = getComputedStyle(document.body).getPropertyValue("--br") || "#2a3248";
      const mut = getComputedStyle(document.body).getPropertyValue("--muted") || "#9aa3b2";
      const btt = getComputedStyle(document.body).getPropertyValue("--btt") || "#3b82f6";
      ctx.fillStyle = txt;

      if (opts.title) { ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillText(opts.title, W/2, 8); }

      const plotW = W - margin.left - margin.right;
      const plotH = H - margin.top - margin.bottom;
      const x0 = margin.left, y0 = H - margin.bottom;

      ctx.strokeStyle = br;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + plotW, y0);
      ctx.moveTo(x0, y0); ctx.lineTo(x0, margin.top); ctx.stroke();

      const n = labels.length;
      const maxVal = Math.max(1, ...values.map(v => Number(v) || 0));
      const yMax = niceMax(maxVal);
      const stepX = plotW / Math.max(1, n);
      const barW = Math.min(40, stepX * 0.72);

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.fillStyle = mut;
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const TICKS = 5;
      for (let i=0; i<=TICKS; i++){
        const v = yMax * i / TICKS, y = y0 - (v / yMax) * plotH;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + plotW, y); ctx.stroke();
        const t = opts.formatY ? opts.formatY(v) : String(v.toFixed(0)); ctx.fillText(t, x0 - 8, y);
      }

      ctx.textAlign = "center"; ctx.textBaseline = "top";
      for (let i=0; i<n; i++){
        const v = Number(values[i] || 0), h = (v / yMax) * plotH;
        const x = x0 + i*stepX + (stepX - barW)/2, y = y0 - h;
        ctx.fillStyle = btt; ctx.fillRect(x, y, barW, h);
        ctx.fillStyle = txt; ctx.fillText(opts.formatY ? opts.formatY(v) : String(v), x + barW/2, Math.max(margin.top + 6, y - 16));
        ctx.fillStyle = mut; ctx.fillText(String(labels[i] ?? ""), x + barW/2, y0 + 12);
      }

      if (opts.totalLabel) {
        const total = values.reduce((a,b)=>a+Number(b||0),0);
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillStyle = txt;
        ctx.fillText(opts.totalLabel + " " + (opts.formatY ? opts.formatY(total) : total.toFixed(0)), W/2, margin.top - 22);
      }
    }

    function drawGroupedDualAxisBarChart(canvas, labels, qtys, values, opts = {}) {
      const { ctx, W, H } = fitCanvas(canvas, opts.height || 300);
      const margin = { top: 36, right: 72, bottom: 86, left: 72, ...(opts.margin||{}) };
      ctx.clearRect(0,0,W,H);
      ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
      const txt = getComputedStyle(document.body).getPropertyValue("--txt") || "#ddd";
      const br  = getComputedStyle(document.body).getPropertyValue("--br") || "#2a3248";
      const mut = getComputedStyle(document.body).getPropertyValue("--muted") || "#9aa3b2";
      const colQty = "#22c55e", colVal = "#3b82f6";

      const plotW = W - margin.left - margin.right;
      const plotH = H - margin.top - margin.bottom;
      const x0 = margin.left, y0 = H - margin.bottom;

      ctx.strokeStyle = br;
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x0 + plotW, y0);
      ctx.moveTo(x0, y0); ctx.lineTo(x0, margin.top);
      ctx.moveTo(x0 + plotW, y0); ctx.lineTo(x0 + plotW, margin.top);
      ctx.stroke();

      const n = labels.length;
      const maxQty = Math.max(1, ...qtys.map(v => Number(v) || 0));
      const maxVal = Math.max(1, ...values.map(v => Number(v) || 0));
      const yMaxQty = niceMax(maxQty), yMaxVal = niceMax(maxVal);
      const stepX  = plotW / Math.max(1, n);
      const groupW = Math.min(60, stepX * 0.8);
      const gap    = Math.min(8, groupW * 0.2);
      const barW   = (groupW - gap) / 2;

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.fillStyle = mut;
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const TICKS = 5;
      for (let i=0; i<=TICKS; i++){
        const v = yMaxQty * i / TICKS, y = y0 - (v / yMaxQty) * plotH;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + plotW, y); ctx.stroke();
        ctx.fillText(fmtQTY(v), x0 - 10, y);
      }
      ctx.textAlign = "left";
      for (let i=0; i<=TICKS; i++){
        const v = yMaxVal * i / TICKS, y = y0 - (v / yMaxVal) * plotH;
        ctx.fillText(fmtUSD(v), x0 + plotW + 10, y);
      }

      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = mut;
      ctx.fillText("Qty (verde) / Valor USD (azul)", x0, margin.top - 26);

      ctx.textAlign = "center"; ctx.textBaseline = "top";
      for (let i=0; i<n; i++){
        const cx = x0 + i*stepX + stepX/2;
        const left = cx - groupW/2;

        const qty = Number(qtys[i] || 0);
        const hq  = (qty / yMaxQty) * plotH;
        const xq  = left, yq = y0 - hq;
        ctx.fillStyle = colQty; ctx.fillRect(xq, yq, barW, hq);
        ctx.fillStyle = txt; ctx.fillText(fmtQTY(qty), xq + barW/2, Math.max(margin.top + 6, yq - 16));

        const val = Number(values[i] || 0);
        const hv  = (val / yMaxVal) * plotH;
        const xv  = left + barW + gap, yv = y0 - hv;
        ctx.fillStyle = colVal; ctx.fillRect(xv, yv, barW, hv);
        ctx.fillStyle = txt; ctx.fillText(fmtUSD(val), xv + barW/2, Math.max(margin.top + 6, yv - 16));

        ctx.fillStyle = mut;
        ctx.fillText(String(labels[i] ?? ""), cx, y0 + 12);
      }
    }

    const qtyOf    = (r)=> Number(r.qty_on_hand ?? r.qty ?? 0);
    const valueOf  = (r)=> {
      const v = r.value_on_hand ?? r.inventory_value ?? r.value ?? null;
      if (v != null) return Number(v);
      const q = qtyOf(r); const u = Number(r.unit_cost ?? r.avg_cost ?? r.cost ?? r.wac ?? r.unit_value ?? 0);
      return q * u;
    };
    const whLabelOf = (r)=>{
      if (typeof r.warehouse === "string") return r.warehouse;
      if (r.warehouse?.name && r.warehouse?.code) return `${r.warehouse.code} — ${r.warehouse.name}`;
      if (r.warehouse?.name) return r.warehouse.name;
      if (r.warehouse_code && r.warehouse_name) return `${r.warehouse_code} — ${r.warehouse_name}`;
      return String(r.warehouse_code ?? r.warehouse_id ?? "Warehouse");
    };

    function groupByWarehouse(rows){
      const map = new Map();
      for (const r of rows){
        const wh = whLabelOf(r);
        const sku = String(r.sku || "").trim(); if (!sku) continue;
        const qty = qtyOf(r); const val = valueOf(r);
        const rec = map.get(wh) || { label: wh, totalValue: 0, bySku: new Map() };
        rec.totalValue += val;
        const s = rec.bySku.get(sku) || { qty: 0, value: 0 };
        s.qty += qty; s.value += val;
        rec.bySku.set(sku, s); map.set(wh, rec);
      }
      return [...map.values()];
    }

    function renderWarehouseCards(groups){
      const host = $("perWarehouseCards");
      host.innerHTML = "";
      const LIMIT = 24;
      for (const g of groups){
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h2>${g.label}</h2>
          <div class="legend">
            <span class="sw sw-qty"></span><span class="subtle">Qty</span>
            <span class="sw sw-val" style="margin-left:14px;"></span><span class="subtle">Valor (USD)</span>
          </div>
          <div class="chart-wrap"><canvas class="chart"></canvas></div>
        `;
        host.appendChild(card);

        const list = [...g.bySku.entries()].sort((a,b)=> b[1].value - a[1].value).slice(0, LIMIT);
        const labels = list.map(([sku]) => sku);
        const qtys   = list.map(([_, s]) => s.qty);
        const values = list.map(([_, s]) => s.value);
        drawGroupedDualAxisBarChart(card.querySelector("canvas"), labels, qtys, values, {});
      }
    }

    function renderTopChart(groups){
      const labels = groups.map(g => g.label);
      const values = groups.map(g => g.totalValue);
      drawBarChart($("whValueChart"), labels, values, { totalLabel: "Total", formatY: (v)=> "$" + v.toFixed(2) });
    }

    await initApi();
    const stock = asArray(await apiGet("/inventory/stock")) || [];
    const groups = groupByWarehouse(stock);
    renderTopChart(groups);
    renderWarehouseCards(groups);
  </script>

  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
