<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ACRES-ERP — Receive</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/ui/assets/nav.css">
</head>
<body>
  <div class="container">
    <h1>Receive</h1>

    <div class="stack-vertical">
      <div class="card" aria-labelledby="recv-title">
        <h2 id="recv-title">Receive</h2>

        <div class="form-grid-3">
          <div>
            <label for="sku">SKU</label>
            <input class="input" id="sku" placeholder=" " list="skuList" autocomplete="off">
            <datalist id="skuList"></datalist>
          </div>

          <div>
            <label for="qty">Qty</label>
            <input class="input" id="qty" type="text" value="1">
          </div>

          <div>
            <label for="unit_cost">Unit Cost (USD)</label>
            <input class="input" id="unit_cost" type="text" value="0,00">
          </div>

          <div>
            <label for="wh">Warehouse</label>
            <select class="input" id="wh"></select>
          </div>
        </div>

        <div class="form-grid-3">
          <div>
            <label for="loc">Location</label>
            <select class="input" id="loc"></select>
          </div>
        </div>

        <div class="hstack">
          <button class="btn" id="doRecv">Receive</button>
          <span id="msg" class="pill" aria-live="polite"></span>
        </div>

        <div class="form-grid-2">
          <div>
            <label>Name</label>
            <div id="infoName" class="muted">—</div>
          </div>
          <div>
            <label>UOM</label>
            <div id="infoType" class="muted">—</div>
          </div>
        </div>
      </div>

      <div class="card" aria-labelledby="snap-title">
        <div class="hstack space-between">
          <h2 id="snap-title">Inventory</h2>
          <button class="btn" id="btnRefresh" type="button">Refresh</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>SKU</th><th>Name</th><th>Warehouse</th>
              <th>Qty On Hand</th><th>WAC (USD)</th><th>Value (USD)</th>
            </tr>
          </thead>
          <tbody id="snapRows"></tbody>
          <tfoot>
            <tr><td colspan="5" style="text-align:right">Total value</td><td id="snapTotal">0.00</td></tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initApi, apiGet, apiPost } from "./js/api.js";
    const $ = (id)=>document.getElementById(id);

    let ITEMS = []; const ITEM_BY_SKU = new Map();
    let WAREHOUSES = []; const WH_BY_ID = new Map();

    function parseNum(s){
      s = String(s ?? "").trim().replace(/\s+/g,"");
      const hasComma = s.includes(","), hasDot = s.includes(".");
      if (hasComma && !hasDot) s = s.replace(",", ".");
      else if (hasComma && hasDot) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
        else s = s.replace(/,/g,"");
      } else s = s.replace(/,/g,"");
      const n = Number(s); if (Number.isNaN(n)) throw new Error("Invalid number"); return n;
    }

    async function loadWarehouses(){
      WAREHOUSES = await apiGet("/warehouses");
      WH_BY_ID.clear();
      const sel = $("wh"); sel.innerHTML = "";
      const blank = document.createElement("option");
      blank.value = ""; blank.textContent = "— select —";
      sel.appendChild(blank);
      for (const w of WAREHOUSES){
        WH_BY_ID.set(w.id, w);
        const o = document.createElement("option"); o.value = w.id; o.textContent = w.code;
        sel.appendChild(o);
      }
      await loadLocations();
    }

    async function loadLocations(){
      try{
        const wh = $("wh").value;
        const params = {};
        if (wh) params.warehouse_id = wh;
        const list = await apiGet("/locations", params);
        const sel = $("loc"); sel.innerHTML = "";
        const blank = document.createElement("option");
        blank.value = ""; blank.textContent = "— select —";
        sel.appendChild(blank);
        for (const l of list){
          const o = document.createElement("option");
          o.value = l.id; o.textContent = (l.code ?? l.id);
          sel.appendChild(o);
        }
      }catch(e){ console.error('loadLocations failed:', e); }
    }

    async function loadSkus(){
      try{
        ITEMS = await apiGet("/items", { limit: 200, offset: 0 });
        const dl = $("skuList"); dl.innerHTML = "";
        ITEM_BY_SKU.clear();
        for (const it of ITEMS){
          ITEM_BY_SKU.set(it.sku, it);
          const opt = document.createElement("option"); opt.value = it.sku; dl.appendChild(opt);
        }
      }catch(e){
        console.error('loadSkus failed:', e);
        alert('Error cargando SKUs: ' + (e.message||e));
      }
    }

    function onPickSKU(sku){
      const it = ITEM_BY_SKU.get(sku);
      $("infoName").textContent = it ? it.name : "—";
      // Mostrar la UOM de inventario (purchase/base), no la de consumo
      $("infoType").textContent = it ? (it.purchase_uom_code || "—") : "—";
    }

    async function loadSnapshot(){
      const data = await apiGet("/inventory/stock");
      const body = []; let total = 0;
      for (const r of data) {
        total += Number(r.value||0);
        body.push(`<tr>
          <td>${r.sku}</td>
          <td>${r.name ?? ""}</td>
          <td>${r.warehouse}</td>
          <td>${Number(r.qty_on_hand||0).toFixed(6)}</td>
          <td>${Number(r.wac||0).toFixed(4)}</td>
          <td>${Number(r.value||0).toFixed(2)}</td>
        </tr>`);
      }
      $("snapRows").innerHTML = body.join("");
      $("snapTotal").textContent = total.toFixed(2);
    }

    $("sku").addEventListener("change", (e)=> onPickSKU(e.target.value.trim()));
    $("wh").addEventListener("change", loadLocations);
    $("btnRefresh").addEventListener("click", loadSnapshot);

    $("doRecv").onclick = async ()=>{
      const msg = $("msg"); msg.textContent = "saving...";
      try{
        const locVal = $("loc").value;
        const body = {
          sku: $("sku").value.trim(),
          warehouse_id: ($("wh").value ? Number($("wh").value) : undefined),
          location_id: (locVal ? Number(locVal) : undefined),
          qty: parseNum($("qty").value),
          unit_cost: parseNum($("unit_cost").value),
          idem_key: 'recv-' + Date.now() + '-' + Math.random().toString(16).slice(2)
        };
        if (!body.sku) throw new Error("SKU requerido");
        if (!body.warehouse_id) throw new Error("Warehouse requerido");
        await apiPost("/inventory/receive_by_sku", body);
        msg.textContent = "ok";
        await loadSnapshot();
      }catch(e){
        console.error(e);
        alert("Error: " + (e.message||e));
        msg.textContent = "error";
      } finally {
        setTimeout(()=> msg.textContent="", 1500);
      }
    };

    await initApi();
    await loadWarehouses();
    await loadSkus();
    await loadSnapshot();
  </script>

  <script type="module" src="/ui/assets/nav.js"></script>
</body>
</html>
